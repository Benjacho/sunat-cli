name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.15.0
          registry-url: https://registry.npmjs.org
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.11
      - name: Pin npm client
        run: npm install --global npm@11.6.4 --registry https://registry.npmjs.org
      - name: Install dependencies
        run: npm ci --ignore-scripts --registry https://registry.npmjs.org
      - name: Secret scan
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Dependency audit
        run: |
          npm audit --audit-level=high
          npm audit signatures
      - name: Privacy regression tests
        run: bun test tests/unit/privacy.test.ts tests/unit/browser-client-privacy.test.ts tests/unit/child-process-privacy.test.ts tests/unit/keychain-privacy.test.ts
        working-directory: packages/cli
      - name: Unit tests
        run: bun test tests/unit
        working-directory: packages/cli
      - name: E2E tests
        run: bun test tests/e2e
        working-directory: packages/cli
      - name: Smoke
        run: bun run bin/sunat.ts -o json cpe doctor
        working-directory: packages/cli
      - name: Build website
        run: npm run build
        working-directory: packages/website
      - name: Verify package contents
        run: |
          pack_dir=$(mktemp -d)
          npm pack --pack-destination "$pack_dir" --ignore-scripts >/tmp/sunat-pack.txt
          pack_file=$(find "$pack_dir" -maxdepth 1 -type f -name '*.tgz' -print -quit)
          test -n "$pack_file"
          tar -tzf "$pack_file" >/tmp/sunat-pack-files.txt
          ! grep -E '(^|/)(tests|scripts)/|RESEARCH\.md|CONTEXT\.md|biome\.json|tsconfig\.json' /tmp/sunat-pack-files.txt
        working-directory: packages/cli
